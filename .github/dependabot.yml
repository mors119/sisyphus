version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'deps(ci)'

  - package-ecosystem: 'gradle'
    directory: '/apps/api'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'deps(backend)'

  - package-ecosystem: 'npm'
    directory: '/apps/web'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'deps(web)'

  - package-ecosystem: 'npm'
    directory: '/apps/chrome-extension'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'deps(extension)'
