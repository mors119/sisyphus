name: sisyphus-stack

services:
  postgres:
    image: postgres:16
    container_name: sisy-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sisy-redis
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sisy-backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}

      JWT_SECRET: ${JWT_SECRET}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL: ${REDIS_SSL:-false}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}

      APP_HOST: ${APP_HOST}
      API_HOST: ${API_HOST}
      IMG_HOST: ${IMG_HOST}

      APP_EXTENSION_HOST: ${APP_EXTENSION_HOST}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      APP_UPLOAD_ALLOWED_EXTENSIONS: png,jpg,jpeg,webp,gif
      FILE_UPLOAD_DIR: /data/uploads/images
      IMAGE_PUBLIC_BASE: ${IMAGE_PUBLIC_BASE}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # Naver/Kakao OAuth is temporarily disabled.
      # NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      # NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      # KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}

    volumes:
      - uploads:/data/uploads/images
    expose:
      - '8080'
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_PROXY_TARGET: ${VITE_PROXY_TARGET}
        VITE_EXTENSION_URL: ${VITE_EXTENSION_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_GOOGLE_REDIRECT_URI: ${VITE_GOOGLE_REDIRECT_URI}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
    container_name: sisy-web
    depends_on:
      - backend
    expose:
      - '80'
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: sisy-nginx
    depends_on:
      - web
      - backend
    ports:
      - '80:80'
    volumes:
      # ✅ 게이트웨이 전용 설정 파일로 분리 (중요)
      - ./gateway/nginx/default.conf:/etc/nginx/conf.d/default.conf
      # 업로드 파일 서빙
      - uploads:/data/uploads/images:ro
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
  jenkins_home:
